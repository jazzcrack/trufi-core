name: trufi_core_maps_example
description: Example app demonstrating trufi_core_maps features.
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  trufi_core_maps:
    path: ../
  latlong2: ^0.9.1
  provider: ^6.1.2
  flutter_map: ^8.2.2
  cached_network_image: ^3.4.1
  # fahrplaner.de fork patch (04.10.2026, siehe FAHRPLANER_PATCHES.md): nur
  # fuer den AttributionButtonPosition-Typ in FlutterMapEngine.buildMap()s
  # Signatur noetig (ITrufiMapEngine-Override) - wurde bisher transitiv ueber
  # trufi_core_maps aufgeloest, depend_on_referenced_packages verlangt eine
  # direkte Abhaengigkeit.
  maplibre_gl: ^0.26.2

dependency_overrides:
  trufi_core_interfaces:
    path: ../../trufi_core_interfaces
  trufi_core_utils:
    path: ../../trufi_core_utils

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
